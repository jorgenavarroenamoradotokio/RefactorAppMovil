###############################################################################
# VERSIONS
###############################################################################
[versions]
agp = "9.2.1"

# Android
appcompat = "1.8.0"
material = "1.14.0"
navigation = "2.10.2"

# Dependencias
hilt = "2.60.1"

# Log
timber = "5.0.1"

# Retrofit2
retrofit2 = "3.0.0"
retrofit2-converter-gson = "3.0.0"

# Okhttp3
okhttp3 = "5.5.1"
okhttp3-logging-interceptor="5.5.1"

# Escaneo por cámara
zxing-android-embedded = "4.3.0"

# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
archCoreTesting = "2.2.0"
robolectric = "4.17"
androidxTestCore = "1.7.0"

###############################################################################
# LIBRARIES
###############################################################################
[libraries]
# Android
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }

# Dependencias
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# Log
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# Retrofit2
retrofit2 = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit2" }
retrofit2-conver = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit2-converter-gson" }

# okhhtp3
okhhtp3 = {group ="com.squareup.okhttp3", name="okhttp", version.ref="okhttp3"}
okhttp3-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp3-logging-interceptor" }

# Escaneo por cámara
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxing-android-embedded" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

###############################################################################
# PLUGINS
###############################################################################
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }